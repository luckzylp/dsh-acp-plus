# Overlay for users who want the extended bridge inside the shipped `acp`
# profile (bundles: base + @deepseek-ai/dsh-acp-app + dsh-acp-plus).
#
# Apply with:  dsh --profile acp --patch ./overlay-on-native-acp.yml
# Or copy these rows into $DSH_HOME/profiles/acp/cordis.patch.yml.
#
# The native bridge must be disabled, otherwise two servers claim stdin.

- id: acp
  disabled: true

- insert:
    # dsh's workspace registry (see cordis.patch.yml): without it an ACP session
    # has no Workspace and grouped surfaces bucket it under "ungrouped".
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Opt-in Agent presets; select one with DSH_ACP_AGENT_PRESET. `standard`
    # inherits the host composition.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        name: Standard
        description: Inherit the host composition.
        plugins: []

    - id: acp-plus-startup
      name: 'dsh-acp-plus/app'

    # The model-facing ask_user_question tool; the bridge answers it through
    # the ACP client's form elicitation (PLAN M5).
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # ACP profiles are separate compositions, so routes added by the desktop
    # app's Models page live only in the desktop profile's patch. Read that
    # profile's `llm-pi-ai` block at startup and activate the same routes here.
    # Set `from` to other profile names or absolute YAML/JSON paths as needed.
    - id: acp-plus-providers
      name: 'dsh-acp-plus/providers'
      config:
        from: [desktop]

    - id: acp-plus
      name: 'dsh-acp-plus'
      inject: [acpPlusStartup]
      config:
        # provider/model fall back to this profile's `agent-default-model`;
        # set them here to pin the extended bridge to an explicit route.
        # session/load and additionalDirectories ship enabled; client terminals
        # are deliberately unsupported (PLAN D9).
        enableSessionLoad: true
        enableAdditionalDirectories: true
        additionalDirectoriesPrompt: routing
