# dsh-acp-plus — profile layer for the extended ACP bridge.
#
# Installed bundle set: ['@deepseek-ai/dsh-base', 'dsh-acp-plus'].
# Use this file when the profile does NOT include @deepseek-ai/dsh-acp-app
# (the shipped `acp` profile already mounts the native bridge; see
# ./overlay-on-native-acp.yml for that case).

# Same persona the native ACP app applies over the base bundle. The working
# directory reaches the model through dsh's `working-directory:current`
# runtime context; do not add a `{{cwd}}` persona suffix. dsh 0.2.1 registers
# only `provider` and `model` as prompt variables, so an unknown variable here
# fails every turn during prompt assembly.
- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# The transport owns stdout and there is no browser to serve titles to.
- id: session-title-llm
  disabled: true

- id: hmr
  disabled: true

- insert:
    # dsh's workspace registry. `@deepseek-ai/dsh-base` does not load it, so an
    # ACP session would have no Workspace and the Web sidebar would bucket it
    # under "ungrouped"; the bridge attaches each session to the workspace for
    # its cwd. The base profile already mounts the storage stack it injects.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Opt-in Agent presets. Set DSH_ACP_AGENT_PRESET in the ACP client's
    # environment to select one for new sessions; `standard` inherits the host
    # composition. Add more @deepseek-ai/dsh-agent-preset rows here to define
    # additional presets.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        name: Standard
        description: Inherit the host composition.
        plugins: []

    # Publishes `acpPlusStartup` after a successful argument parse, and binds
    # stdin EOF to the launcher's bounded shutdown. `--help` publishes nothing,
    # so the bridge row below waits and stdio stays unclaimed.
    - id: acp-plus-startup
      name: 'dsh-acp-plus/app'

    # The model-facing ask_user_question tool; the bridge answers it through
    # the ACP client's form elicitation (PLAN M5).
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # ACP profiles are separate compositions, so routes added by the Web
    # Models page live only in the Web profile's patch. Read that profile's
    # `llm-pi-ai` block at startup and activate the same routes here. Set
    # `from` to other profile names or absolute YAML/JSON paths as needed.
    - id: acp-plus-providers
      name: 'dsh-acp-plus/providers'
      config:
        from: [web, desktop]

    - id: acp-plus
      name: 'dsh-acp-plus'
      inject: [acpPlusStartup]
      config:
        # provider/model are deliberately unset: the bridge falls back to the
        # composition's `agent-default-model` (the Web Models page writes that
        # same service), so a profile configures its model once. Set them here
        # only to pin this bridge to a route regardless of the default.
        sessionListPageSize: 100
        # M2/M3 landed and are locked by tests/session-load.test.ts and
        # tests/directories.test.ts. Additional roots are honored through the
        # existing one-shot escalation with path containment; clients already
        # choose cwd, so this is the same trust level.
        enableSessionLoad: true
        enableAdditionalDirectories: true
        # Declared roots reach the model as one system-prompt section with a
        # root map and working @alias/ routing. `map` keeps the map but drops
        # the syntax; `off` injects nothing.
        additionalDirectoriesPrompt: routing
        # Commands and modes (M5) are client-visible additions with no gate;
        # elicitation activates only for clients declaring form support.
        # Client terminals are deliberately unsupported (PLAN D9): DSH always
        # has local command execution, and ACP's one-shot model cannot carry
        # the harness's persistent-PTY semantics.
